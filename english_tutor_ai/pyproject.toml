[project]
name = "english-tutor-ai"
version = "0.1.0"
description = "Real-time voice conversational AI English tutor with long-term memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai[silero,groq,kokoro,local]",
    "mem0ai[extras,nlp]",
    "qdrant-client",
    "sentence-transformers",
    "pydantic-settings",
    "python-dotenv",
    "loguru",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
